version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bootcamp-postgres
    environment:
      POSTGRES_DB: bootcamp_db
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: senko
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: